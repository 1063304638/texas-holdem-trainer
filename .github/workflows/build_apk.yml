name: 构建安卓 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: 编译 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 接受 Android SDK 许可
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
        continue-on-error: true

      - name: 生成 Android 平台工程并拷入源码
        run: |
          set -e
          flutter create \
            --project-name texas_holdem_trainer \
            --org com.example.pokertrainer \
            --platforms=android \
            ci_app
          rm -rf ci_app/lib ci_app/test
          cp -r lib ci_app/lib
          cp -r test ci_app/test
          cp pubspec.yaml analysis_options.yaml ci_app/
          cd ci_app
          flutter pub get

      - name: 静态检查（仅供参考）
        run: flutter analyze
        working-directory: ci_app
        continue-on-error: true

      - name: 跑单元测试（仅供参考）
        run: flutter test
        working-directory: ci_app
        continue-on-error: true

      - name: 打包 Release APK
        run: flutter build apk --release
        working-directory: ci_app

      - name: 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: texas-holdem-trainer-apk
          path: ci_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
